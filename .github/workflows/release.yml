name: Build precompiled NIFs

on:
  push:
    tags:
      - "v*"

jobs:
  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.17", "2.16"]
        # `glibc` is the newest glibc a gnu artifact may require, enforced
        # by check_glibc_floor.sh below. What an artifact requires is decided
        # by the libc it is LINKED against, not by the code: Rust's std keeps
        # weak references to whatever that libc offers, and the loader
        # refuses the whole library over a single too-new reference. So the
        # build image is part of the artifact's contract:
        #
        #   * aarch64 and riscv64 build with the cross 0.2.5 release, whose
        #     images are Ubuntu 16.04 / 18.04 (glibc 2.23 / 2.27). cross
        #     built from source uses Ubuntu 24.04 images, and its glibc 2.39
        #     is what made the 0.14.0 aarch64 NIF unloadable on Nerves
        #     systems with glibc 2.38.
        #   * arm builds its own old-glibc toolchain inside the cross image
        #     (crosstool-ng), so building cross from source is fine there.
        #   * x86_64 links natively against the runner's glibc: moving it off
        #     ubuntu-22.04 (2.35) raises the floor for every x86_64 user.
        job:
          - { target: arm-unknown-linux-gnueabihf,  os: ubuntu-22.04, use-cross: true, glibc: "2.28" }
          - { target: aarch64-unknown-linux-gnu,    os: ubuntu-22.04, use-cross: true, cross-version: v0.2.5, glibc: "2.28" }
          - { target: aarch64-unknown-linux-musl,   os: ubuntu-22.04, use-cross: true }
          - { target: riscv64gc-unknown-linux-gnu,  os: ubuntu-22.04, use-cross: true, cross-version: v0.2.5, glibc: "2.28" }
          - { target: x86_64-unknown-linux-gnu,     os: ubuntu-22.04, glibc: "2.35" }
          - { target: x86_64-unknown-linux-musl,    os: ubuntu-22.04, use-cross: true }
          - { target: aarch64-apple-darwin,         os: macos-15 }
          - { target: x86_64-apple-darwin,          os: macos-15 }
          - { target: x86_64-pc-windows-gnu,        os: windows-2025 }
          - { target: x86_64-pc-windows-msvc,       os: windows-2025 }

    steps:
      - uses: actions/checkout@v7

      - name: Extract project version
        shell: bash
        run: |
          echo "PROJECT_VERSION=$(sed -n 's/^  @version "\(.*\)"/\1/p' mix.exs | head -n1 | tr -d '\r')" >> $GITHUB_ENV

      - name: Add Rust target
        shell: bash
        run: rustup target add ${{ matrix.job.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-precomp
          shared-key: ${{ matrix.job.target }}-${{ matrix.nif }}
          workspaces: native/ex_ratatui

      - name: Build the project
        id: build-crate
        uses: philss/rustler-precompiled-action@v1.1.5
        with:
          project-name: ex_ratatui
          project-version: ${{ env.PROJECT_VERSION }}
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          use-cross: ${{ matrix.job.use-cross }}
          cross-version: ${{ matrix.job.cross-version || 'from-source' }}
          project-dir: "native/ex_ratatui"

      - name: Ensure the musl NIF is self-contained
        if: contains(matrix.job.target, 'musl')
        run: |
          mkdir -p /tmp/nif-gate
          tar -xzf "${{ steps.build-crate.outputs.file-path }}" -C /tmp/nif-gate
          sh .github/scripts/check_musl_nif.sh "$(find /tmp/nif-gate -name '*.so' | head -1)"

      - name: Ensure the glibc NIF loads on old systems
        if: matrix.job.glibc
        run: |
          mkdir -p /tmp/nif-gate
          tar -xzf "${{ steps.build-crate.outputs.file-path }}" -C /tmp/nif-gate
          sh .github/scripts/check_glibc_floor.sh "$(find /tmp/nif-gate -name '*.so' | head -1)" "${{ matrix.job.glibc }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build-crate.outputs.file-name }}
          path: ${{ steps.build-crate.outputs.file-path }}

  publish:
    name: Publish release
    needs: build_release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish archives and packages
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
