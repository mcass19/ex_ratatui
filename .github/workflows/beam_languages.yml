name: BEAM Languages

# Builds and runs the Erlang and Gleam examples with their own toolchains.
#
# gleam: Gleam only takes ExRatatui from Hex, so the job copies this branch's
# lib, mix.exs and checksum file over the downloaded package (a Gleam-internal
# layout, hence the pinned version). The NIF still comes from the last release.
#
# rebar3: rebar3 can't take that overlay, so this job runs the example against
# the last Hex release. test/examples_test.exs runs the EUnit suite against this branch.
#
# guard: as in burrito_demo.yml, skips while a release's checksums are missing.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  guard:
    name: Checksums cover @version?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      buildable: ${{ steps.check.outputs.buildable }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the checksum file covers the current version
        id: check
        run: |
          version=$(sed -n 's/^  @version "\(.*\)"/\1/p' mix.exs | head -n1 | tr -d '\r')
          if grep -qF -- "-v${version}-nif-" checksum-Elixir.ExRatatui.Native.exs; then
            echo "buildable=true" >> "$GITHUB_OUTPUT"
          else
            echo "buildable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No v${version} entries in the NIF checksum file (release in flight) — skipping; the checksum commit will exercise the new artifacts."
          fi

  gleam:
    needs: guard
    if: needs.guard.outputs.buildable == 'true'
    name: Gleam
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash
        working-directory: examples/gleam/counter

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.1"
          elixir-version: "1.20"
          gleam-version: "1.19.2"
          rebar3-version: "3.28"

      - name: Download dependencies
        run: gleam deps download

      - name: Overlay this branch's ExRatatui
        run: |
          package=build/packages/ex_ratatui
          rm -rf "$package/lib" "$package/_build" build/dev
          cp -r ../../../lib ../../../mix.exs ../../../checksum-Elixir.ExRatatui.Native.exs "$package/"

      - name: Test
        run: gleam test

      - name: Run on a real terminal
        env:
          TERM: xterm-256color
        run: |
          gleam build
          # Without a size the app draws into 0x0. Esc repeats in case it was slow to start.
          timeout 120 script -qec "stty cols 80 rows 24; gleam run" pty.log < <(
            sleep 5
            printf '\033[A'
            sleep 0.2
            printf 'hi\r'
            sleep 2
            for _ in $(seq 1 60); do
              printf '\033'
              sleep 1
            done
          )
          # Frames are diffs that skip spaces, so check tokens rather than whole lines.
          grep -aq 'Counter:' pty.log
          test "$(grep -ao '?1049h' pty.log | wc -l)" -eq 1
          test "$(grep -ao '?1049l' pty.log | wc -l)" -eq 1

  rebar3:
    needs: guard
    if: needs.guard.outputs.buildable == 'true'
    name: Erlang
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash
        working-directory: examples/erlang/counter

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.1"
          elixir-version: "1.20"
          rebar3-version: "3.28"

      - name: Put Elixir on ERL_LIBS
        run: echo "ERL_LIBS=$(elixir -e 'IO.puts(Path.dirname(:code.lib_dir(:elixir)))')" >> "$GITHUB_ENV"

      - name: Test
        run: rebar3 eunit

      - name: Run on a real terminal
        env:
          TERM: xterm-256color
        run: |
          rebar3 compile
          # Without a size the app draws into 0x0. Esc repeats in case it was slow to start.
          timeout 120 script -qec "stty cols 80 rows 24; erl -noshell -pa _build/default/lib/*/ebin -eval '{ok, _} = application:ensure_all_started(ex_ratatui), erlang_counter:start(), init:stop().'" pty.log < <(
            sleep 5
            printf '\033[A'
            sleep 0.2
            printf 'hi\r'
            sleep 2
            for _ in $(seq 1 60); do
              printf '\033'
              sleep 1
            done
          )
          # Frames are diffs that skip spaces, so check tokens rather than whole lines.
          grep -aq 'Counter:' pty.log
          test "$(grep -ao '?1049h' pty.log | wc -l)" -eq 1
          test "$(grep -ao '?1049l' pty.log | wc -l)" -eq 1
