name: Burrito Demo

# Builds examples/burrito_demo as a native single-file binary on each
# supported OS/arch and runs a non-interactive --version smoke test that
# proves the BEAM boots and the ex_ratatui NIF loads inside the wrapped
# binary. Artifacts are uploaded for inspection.
#
# Each runner builds only its own target via BURRITO_TARGET, so no host
# needs the union of cross-build tools — its native target's precompiled
# NIF gets resolved by rustler_precompiled and bundled into the payload.
#
# The linux job builds with TARGET_ABI=musl, so the published musl NIF —
# the artifact every musl consumer downloads — is smoke-tested inside
# burrito's musl wrapper on every push.

on:
  pull_request:
  push:
    branches: [main, burrito]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact: burrito_demo_linux
            # Burrito's linux wrapper uses a musl runtime, so the bundled
            # NIF must be the musl variant even when building on glibc.
            target_abi: musl
          - os: macos-14
            target: macos_silicon
            artifact: burrito_demo_macos_silicon
          - os: windows-latest
            target: windows
            artifact: burrito_demo_windows.exe

    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.2"
          elixir-version: "1.18"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Get deps
        working-directory: examples/burrito_demo
        run: mix deps.get

      - name: Build release
        working-directory: examples/burrito_demo
        env:
          BURRITO_TARGET: ${{ matrix.target }}
          MIX_ENV: prod
          MATRIX_TARGET_ABI: ${{ matrix.target_abi }}
        run: |
          # Only export TARGET_ABI when set — empty string is truthy in
          # rustler_precompiled and produces a broken triple.
          if [ -n "${MATRIX_TARGET_ABI}" ]; then
            export TARGET_ABI="${MATRIX_TARGET_ABI}"
          fi
          mix release --overwrite

      - name: Smoke test --version
        working-directory: examples/burrito_demo
        run: ./burrito_out/${{ matrix.artifact }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: examples/burrito_demo/burrito_out/${{ matrix.artifact }}
          retention-days: 7
